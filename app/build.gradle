apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        versionCode 1
        versionName "4.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        // here i excluded theme azl and DZ 
        buildConfigField "boolean", "INCLUDE_THEME_AZL", INCLUDE_THEME_AZL.toString()
        buildConfigField "boolean", "INCLUDE_THEME_DZ", INCLUDE_THEME_DZ.toString()

    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    namespace 'com.android.support'
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}